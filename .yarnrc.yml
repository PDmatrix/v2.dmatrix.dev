nodeLinker: node-modules
npmRegistryServer: "https://registry.npmjs.org"

yarnPath: .yarn/releases/yarn-4.18.1.cjs

# Avoid executing arbitrary dependency install scripts. Native packages used here
# ship prebuilt binaries. The root project's Husky postinstall still runs.
enableScripts: false
# Allow a day for newly published packages to be reviewed before upgrades.
npmMinimalAgeGate: 1440

# Upstream packaging omissions in Astro's checker (remove once fixed upstream).
packageExtensions:
  "@astrojs/astro2tsx@0.1.2":
    dependencies:
      "@emnapi/runtime": "1.11.3"
  "@astrojs/compiler-binding-wasm32-wasi@0.4.1":
    dependencies:
      "@emnapi/core": "1.11.3"
      "@emnapi/runtime": "1.11.3"
  "@astrojs/language-server@2.17.1":
    peerDependencies:
      typescript: "^6.0.3"
